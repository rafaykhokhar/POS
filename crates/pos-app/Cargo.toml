[package]
name = "pos-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ev-pos"
path = "src/main.rs"

[dependencies]
pos-core = { path = "../pos-core" }
slint = "1.18"
chrono.workspace = true
dirs = "6"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18"

# Icon and file details for the Windows .exe
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Headless window for end-to-end tests of the real app.
i-slint-backend-testing = "=1.18.1"
